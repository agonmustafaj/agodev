# Cloudflare Pages project for AgoDev (static site + /api/contact Function)
# Static assets live in public/. Functions stay at repo-root functions/
# so they are siblings of the build output (required for Pages Functions).
name = "agodev"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

# Secrets (Pages → Settings → Environment variables, encrypt):
#   RESEND_API_KEY, CONTACT_TO, CONTACT_FROM
# Optional plain text var:
#   ALLOWED_ORIGINS=https://agodev.agonmustafaj.com,https://agonmustafaj.com,https://www.agonmustafaj.com
